name: WCH EVT wvproj builds

on:
  push:
    paths:
      - "ref/wch-evt/**"
      - ".github/workflows/wvproj.yml"
  pull_request:
    paths:
      - "ref/wch-evt/**"
      - ".github/workflows/wvproj.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Projects to compile
        required: true
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: read

env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'fast' }}
  # Where the EVT corpus pack lives, for checkouts that do not carry the
  # corpus itself (the public repository).  See toolchain-ci.yml.
  EVT_PACK_URL: ${{ vars.EVT_PACK_URL }}

jobs:
  wvproj:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The archive is large, so keep the verified MRS source package between
      # runs.  fetch_wch_toolchain.py rejects a cache hit unless both its size
      # and SHA-256 match the pinned MRS 2.5.0 package.
      - name: Cache WCH toolchain archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wch-evt-cache
          key: wch-evt-linux-amd64-gcc15-${{ hashFiles('ref/wch-evt/tools/fetch_wch_toolchain.py') }}

      - name: Provision WCH GCC15
        run: |
          set -eu
          if [ -n "${COMPILER_PATH:-}" ]; then
            test -x "$COMPILER_PATH"
          else
            python3 ref/wch-evt/tools/fetch_wch_toolchain.py \
              --destination "$RUNNER_TEMP/wch-evt-toolchain" \
              --cache-dir "$RUNNER_TEMP/wch-evt-cache"
            COMPILER_PATH="$RUNNER_TEMP/wch-evt-toolchain/bin/riscv32-wch-elf-gcc"
            echo "COMPILER_PATH=$COMPILER_PATH" >> "$GITHUB_ENV"
          fi
          "$COMPILER_PATH" --version | head -n 1
          test "$($COMPILER_PATH -dumpmachine)" = riscv32-wch-elf

      - name: Cache the EVT corpus pack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Expression form, not $RUNNER_TEMP: `with:` inputs are not run
          # through a shell, so a shell variable would be taken literally.
          path: ${{ runner.temp }}/evt-cache
          key: evt-pack-18b7ddd6cb6bf148881648800a33097d3ff035019fe3ded55689aa0a3c646b58

      - name: Provision the EVT corpus and apply its patches
        run: |
          set -eu
          cache_dir="$RUNNER_TEMP/evt-cache"
          pack="$cache_dir/openwch-evt-d5added7.tar.gz"
          # Created unconditionally: the cache's post step reports a path that
          # does not exist, and the in-tree branch never creates one.
          mkdir -p "$cache_dir"
          if [ -d ref/wch-evt/QingkeV2AC_CH32V00x ]; then
            printf 'P7_EVT\tcorpus=in-tree\tpack=not-needed\n'
          elif [ -f "$pack" ]; then
            printf 'P7_EVT\tcorpus=absent\tpack=cache-hit\n'
            scripts/fetch-evt.sh --file "$pack"
          else
            printf 'P7_EVT\tcorpus=absent\tpack=cache-miss\n'
            if [ -z "${EVT_PACK_URL:-}" ]; then
              echo "The EVT corpus is not in this checkout, no pack is cached, and EVT_PACK_URL is empty." >&2
              echo "Set the repository variable EVT_PACK_URL to the URL of openwch-evt-d5added7.tar.gz" >&2
              echo "(Settings > Secrets and variables > Actions > Variables), or run act locally with" >&2
              echo "--env EVT_PACK_URL=<url>.  The pack's SHA-256 is pinned in scripts/fetch-evt.sh." >&2
              exit 1
            fi
            download="$RUNNER_TEMP/openwch-evt-pack.tar.gz"
            curl -fSL --retry 3 --retry-delay 2 -o "$download" "$EVT_PACK_URL"
            # fetch-evt.sh checks the SHA-256 fail-closed before it unpacks, so
            # reaching the mv is itself the proof that these are the pinned
            # bytes.  --apply is not used here: the apply below covers both
            # ways in, so neither can drift from the other.
            scripts/fetch-evt.sh --file "$download"
            mv "$download" "$pack"
          fi
          sh ref/wch-evt/patches/apply.sh

      - name: Build and clean EVT projects
        env:
          MAKE_JOBS: 2
          WVPROJ_WORKERS: 2
        run: python3 ref/wch-evt/tests/test_wvproj_to_make.py
