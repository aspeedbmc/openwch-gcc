          set -eu
          printf 'P7_FACT\tnproc\t%s\n' "$(sysctl -n hw.ncpu)"
          printf 'P7_FACT\tuname\t%s %s\n' "$(uname -s)" "$(uname -m)"
          /usr/bin/clang --version | sed -n 1p
          command -v gtar >/dev/null 2>&1 || brew install gnu-tar
          gtar --version | sed -n 1p
          df -k . | tail -n 1

      - name: Ensure Homebrew zstd is present
        run: |
          set -eu
          if [ ! -e /opt/homebrew/include/zstd.h ] || [ ! -e /opt/homebrew/lib/libzstd.dylib ]; then
            brew install zstd
          fi

      - name: Provision the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprovision\t%s\n' "$(date +%s)"
          scripts/ci/provision-official.sh "$OPENWCH_VERSION"
          printf 'P7_DISK\tafter-provision\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
