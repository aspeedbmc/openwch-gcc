            printf 'P7_EVT\tcorpus=in-tree\tpack=not-needed\n'
          elif [ -f "$pack" ]; then
            printf 'P7_EVT\tcorpus=absent\tpack=cache-hit\n'
            scripts/fetch-evt.sh --file "$pack"
          else
            printf 'P7_EVT\tcorpus=absent\tpack=cache-miss\n'
            if [ -z "${EVT_PACK_URL:-}" ]; then
              echo "The EVT corpus is not in this checkout, no pack is cached, and EVT_PACK_URL is empty." >&2
              echo "Set the repository variable EVT_PACK_URL to the URL of openwch-evt-d5added7.tar.gz" >&2
              echo "(Settings > Secrets and variables > Actions > Variables), or run act locally with" >&2
              echo "--env EVT_PACK_URL=<url>.  The pack's SHA-256 is pinned in scripts/fetch-evt.sh." >&2
              exit 1
            fi
            download="$RUNNER_TEMP/openwch-evt-pack.tar.gz"
            curl -fSL --retry 3 --retry-delay 2 -o "$download" "$EVT_PACK_URL"
            # fetch-evt.sh checks the SHA-256 fail-closed before it unpacks, so
            # reaching the mv is itself the proof that these are the pinned
            # bytes.  --apply is not used here: the apply below covers both
            # ways in, so neither can drift from the other.
            scripts/fetch-evt.sh --file "$download"
            mv "$download" "$pack"
          fi
          sh ref/wch-evt/patches/apply.sh

      - name: Prepare pristine sources and apply the patch series
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprepare\t%s\n' "$(date +%s)"
          scripts/ci/prepare-sources.sh "$OPENWCH_VERSION"
          printf 'P7_STAGE\tend\tprepare\t%s\n' "$(date +%s)"

      - name: Create the literal build path
        run: scripts/ci/setup-literal-paths.sh "$OPENWCH_VERSION"

      - name: Build the toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tbuild\t%s\n' "$(date +%s)"
          target="${TOOLCHAIN_TREE:-$TOOLCHAIN_PROJECT}"
          samples="$RUNNER_TEMP/build-samples.tsv"
          : > "$samples"
          (
            while : ; do
              now=$(date +%s)
              kb=$( { du -sk "$target" 2>/dev/null || true; } | awk '{print $1}' || true)
              if [ -r /sys/fs/cgroup/memory.peak ]; then
                mem=$(cat /sys/fs/cgroup/memory.peak || echo 0); memmax=-1; memkind=cgroup-peak-bytes
              else
                # macOS has no cgroup.  The metric is vm_stat app memory
                # (active + wired + compressed), chosen by measurement: a
                # `ps -A -o rss=` sum reads 5.1x higher than app memory on the
                # same machine at the same instant, because RSS counts shared
                # text once per process.  "Pages free" is unusable in the other
                # direction -- macOS keeps memory nearly full as cache, so free
                # sits near zero and would imply the box is already exhausted.
                # Known bias: this metric reads LOW (the compressor absorbs
                # pages), so treat it as a floor.
                mem=$( { vm_stat 2>/dev/null || true; } | awk '
                  /page size of/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { psz = $i; break } }
                  /^Pages active:/ { gsub(/\./, "", $NF); a = $NF }
                  /^Pages wired down:/ { gsub(/\./, "", $NF); w = $NF }
                  /^Pages occupied by compressor:/ { gsub(/\./, "", $NF); c = $NF }
                  END { print (a + w + c) * psz }' || echo 0)
                memmax=-1
                memkind=vm_stat-app-bytes
              fi
              printf 'P7_SAMPLE\tbuild\t%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind" >> "$samples"
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          CLEAN_HOST_DEPS=1 scripts/build-toolchain-8.2.0.sh
          kill "$sampler" 2>/dev/null || true
          trap - EXIT
          printf 'P7_DISK\tbuild-peak\t%s\tpeak du -sk of the source and build tree\n' \
            "$(awk -F'\t' '{if ($2+0 > m) m = $2+0} END {print m+0}' "$samples")"
          printf 'P7_MEM\tbuild-peak\t%s\t%s\n' \
            "$(awk -F'\t' '{if ($3+0 > m) m = $3+0} END {print m+0}' "$samples")" \
            "$(awk -F'\t' 'END {print $5}' "$samples")"
          printf 'P7_MEM\tbuild-peak-largest-process\t%s\tps rss KiB; -1 means the cgroup path was used\n' \
            "$(awk -F'\t' '{if ($4+0 > m) m = $4+0} END {print m+0}' "$samples")"
          printf 'P7_STAGE\tend\tbuild\t%s\n' "$(date +%s)"

      - name: Upload the build stage logs
        # The build scripts write each stage's output to files under the source
        # tree; on a hosted runner those vanish with the workspace, so a failed
        # build is undiagnosable without this.  failure()-gated: green runs add
        # nothing.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ env.OPENWCH_PLATFORM }}-${{ env.OPENWCH_VERSION }}
          path: tmp/**/logs/**
          if-no-files-found: warn

      - name: Generate the golden manifest with the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-golden\t%s\n' "$(date +%s)"
          scripts/evt-golden.sh "$OPENWCH_VERSION"
          printf 'P7_STAGE\tend\tgate-golden\t%s\n' "$(date +%s)"

      - name: 'Assertion 1 and 2: manifest scale against absolute constants'
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          gate_rows=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" && $3 == "gate" { c++ } END { print c+0 }' "$manifest")
          projects=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" { print $1 }' "$manifest" | sort -u | wc -l | tr -d '[:space:]')
          echo "manifest_gate_rows=$gate_rows expected=$GATE_ARTIFACT_TOTAL"
          echo "manifest_projects=$projects expected=$GATE_PROJECT_TOTAL"
          test "$gate_rows" = "$GATE_ARTIFACT_TOTAL"
          test "$projects" = "$GATE_PROJECT_TOTAL"

      - name: Compare our toolchain against the fresh manifest
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-compare\t%s\n' "$(date +%s)"
          set -o pipefail
          status=0
          scripts/evt-compare.sh "$OPENWCH_VERSION" \
            "$TOOLCHAIN_PROJECT/darwin-x64/install/riscv-none-embed-gcc" \
            | tee "$RUNNER_TEMP/evt-compare.log" || status=$?
          echo "$status" > "$RUNNER_TEMP/evt-compare.status"
          echo "evt_compare_status=$status"
          printf 'P7_DISK\tafter-gate\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_MEM\tgate-peak\t%s\t%s\n' \
            "$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || ps -A -o rss= | awk '{s+=$1} END {print s+0}')" \
            "$([ -r /sys/fs/cgroup/memory.peak ] && echo cgroup-peak-bytes || echo ps-rss-kb)"
          printf 'P7_STAGE\tend\tgate-compare\t%s\n' "$(date +%s)"

      - name: 'Assertion 3: comparison summary'
        run: |
          set -eu
          summary=$(awk -F '\t' '$1 == "SUMMARY" { print }' "$RUNNER_TEMP/evt-compare.log")
          test -n "$summary"
          echo "$summary"
          printf '%s\n' "$summary" | awk -F '\t' -v want="gate_pass=$GATE_ARTIFACT_TOTAL" '
            {
              pass = 0; fail = 0
              for (i = 2; i <= NF; i++) {
                if ($i == want) pass = 1
                if ($i == "gate_fail=0") fail = 1
              }
              exit (pass && fail) ? 0 : 1
            }'
          test "$(cat "$RUNNER_TEMP/evt-compare.status")" = "0"

      - name: Package the gated toolchain
        run: |
          set -eu
          name="openwch-toolchain-${OPENWCH_VERSION}-${OPENWCH_PLATFORM}"
          stage="$RUNNER_TEMP/package"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$TOOLCHAIN_PROJECT/darwin-x64/install/riscv-none-embed-gcc" "$stage/$name"
          mkdir -p "$RUNNER_TEMP/assets"
          gtar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
               --owner=0 --group=0 --numeric-owner --format=gnu \
               -C "$stage" -cf - "$name" \
            | gzip -n > "$RUNNER_TEMP/assets/$name.tar.gz"
          ( cd "$RUNNER_TEMP/assets" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          cat "$RUNNER_TEMP/assets/$name.tar.gz.sha256"

      - name: Publish the release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/assets/*.tar.gz
            ${{ runner.temp }}/assets/*.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Upload the assets as a workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-darwin-arm64-8.2.0
          path: ${{ runner.temp }}/assets
          if-no-files-found: warn
