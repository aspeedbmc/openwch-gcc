            # reaching the mv is itself the proof that these are the pinned
            # bytes.  --apply is not used here: the apply below covers both
            # ways in, so neither can drift from the other.
            scripts/fetch-evt.sh --file "$download"
            mv "$download" "$pack"
          fi
          sh ref/wch-evt/patches/apply.sh

      - name: Prepare pristine sources and apply the patch series
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprepare\t%s\n' "$(date +%s)"
          scripts/ci/prepare-sources.sh "$OPENWCH_VERSION"
