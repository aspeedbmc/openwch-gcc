          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          echo "raw_drift_lines=$(git diff --numstat -- "$manifest" | awk '{print $1"+"$2}')"
