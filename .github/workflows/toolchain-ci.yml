# Rebuild every toolchain version from pristine upstream sources plus this
# repository's patch series, then prove byte equality against the official WCH
# package in the same run and the same working directory.
#
# ---------------------------------------------------------------------------
# Scope boundary: the full EVT tree is deliberately NOT run here.
# ---------------------------------------------------------------------------
# The closing gate for a version is the full EVT tree (1298 projects built
# twice, once with the official toolchain and once with ours).  It does not fit
# a hosted runner on either axis:
#   * disk -- every candidate runner ships 14 GB of SSD, total, including the
#     operating system and preinstalled software (ubuntu-24.04, macos-15 and
#     macos-15-intel are all 14 GB).  One darwin leg already spends ~1.4 GB on
#     the MounRiver archive plus the extracted official tree, the upstream
#     checkouts and a complete GCC build tree.
#   * time -- a job is killed at 6 hours on every hosted runner, and
#     timeout-minutes cannot raise that ceiling.  macOS concurrency is capped at
#     5 jobs on Free/Pro/Team plans, so the work cannot be spread sideways
#     either.
# The full tree therefore stays a local, operator-driven run; the nine-project
# quick regression set below is the push/pull-request gate.  The generator for
# the full local leg is still unversioned (P2-19) and is tracked outside this
# workflow.
#
# ---------------------------------------------------------------------------
# Why the manifest is regenerated instead of read from analysis/golden/
# ---------------------------------------------------------------------------
# The committed manifests embed the absolute working directory they were made
# in, and building with -g writes that directory into DW_AT_comp_dir.  A
# manifest made elsewhere can never match here.  Every job therefore runs
# evt-golden.sh against the official package first and evt-compare.sh against
# our build second, in one run and one directory.  The committed manifest is
# printed as a raw drift diagnostic only and is never a pass/fail signal.
#
# ---------------------------------------------------------------------------
# Why the scale of that fresh manifest is asserted against absolute constants
# ---------------------------------------------------------------------------
# evt-compare.sh derives its expected gate total from the manifest it is about
# to check (evt-compare.sh:182).  With a manifest generated in the same run,
# verifier and verified share a source: if a project were excluded here, the
# manifest would shrink and the comparison would report "all passed" over the
# smaller denominator.  Each job therefore asserts the artifact and project
# counts against constants that do not come from that manifest, before the
# comparison runs.

name: Toolchain byte gate

on:
  push:
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "ref/wch-evt/**"
  pull_request:
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "ref/wch-evt/**"
  workflow_dispatch:

permissions:
  contents: read

# act executes a container job's `run:` steps with `sh -e` (dash), where
# `set -o pipefail` is an illegal option and PIPESTATUS does not exist --
# measured, not assumed.  Naming the shell makes act and GitHub agree and
# keeps the pipefail-dependent steps below valid in both.
defaults:
  run:
    shell: bash

# The concurrency contract, stated here so it is visible in the workflow and
# not only in the harness defaults: 16 project-level workers, each project
# building with make -j2 (hard-coded at evt-golden.sh:189 and
# evt-compare.sh:143), and BUILD_JOBS=16 for the toolchain build itself.  These
# are pinned even where they match the defaults, and they are NOT lowered to
# match a smaller runner: a 3-4 core runner oversubscribes, and each job logs
# its actual core count so the oversubscription is on the record.
env:
  BUILD_JOBS: "16"
  EVT_GOLDEN_WORKERS: "16"
  EVT_COMPARE_WORKERS: "16"
  # Where the EVT corpus pack lives, for the checkouts that do not carry the
  # corpus itself.  Empty on a repository that has not set the variable; the
  # provisioning step then fails with instructions instead of silently
  # building the gate on a partial corpus.
  EVT_PACK_URL: ${{ vars.EVT_PACK_URL }}

jobs:
  linux-15-2-0:
    name: linux-amd64 GCC 15.2.0
    runs-on: ubuntu-24.04
    # Below the platform's 6 h hard limit on purpose: at exactly 360 the
    # platform cuts the job silently, losing the very data that would
    # explain the overrun.  15 minutes of headroom buys a diagnosable
    # timeout that still flushes what the instrumentation has collected.
    timeout-minutes: 345
    # Pinned by digest.  This string is the multi-architecture OCI index digest
    # for debian:bookworm; on an x64 runner it resolves to the amd64 manifest
    # sha256:41a613df4beca480a97c22b1f6837f7502cb95206e2cc2daf1ea3cb28f8755ab.
    # A local act run must pass --container-architecture linux/amd64 or an
    # Apple Silicon host resolves the arm64 variant instead and
    # build-toolchain-15.2.0-linux.sh:31 refuses to run.
    container:
      image: debian:bookworm@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
    env:
      OPENWCH_VERSION: "15.2.0"
      OPENWCH_PLATFORM: linux-amd64
      GATE_ARTIFACT_TOTAL: "274"
      GATE_PROJECT_TOTAL: "9"
      # evt-golden.sh:45-47 refuses to run on linux without this, and it does so
      # only at gate time -- hours after the build starts.  It is recorded in
      # the manifest header as provenance and pulls nothing.
      EVT_CONTAINER_IMAGE: "debian:bookworm@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc"
      TOOLCHAIN_TREE: tmp/ci-src/15.2.0/riscv-gnu-toolchain
    steps:
      - name: Install git before the checkout
        # The job runs in a bare debian:bookworm container, and actions/checkout
        # falls back to a REST tarball download when the container has no git --
        # which leaves no .git directory, and build-toolchain-15.2.0-linux.sh
        # refuses to run without repository metadata.  Installing git first makes
        # the checkout a real clone.  (act does not hit this: its workspace copy
        # carries the .git that act-verify's git init created.)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The package list starts from the commands
      # build-toolchain-15.2.0-linux.sh:37-44 requires, plus m4 (GMP's build
      # needs it), the archive tools contrib/download_prerequisites unpacks
      # with, and curl for the fetch itself.  Two entries do not come from that
      # command table and were found by probing the base image: `patch`, which
      # ref/wch-evt/patches/apply.sh shells out to and which bookworm does not
      # ship, and zlib1g-dev, which the binutils configure line's
      # --with-system-zlib needs and which a command table structurally cannot
      # reveal because it is a library, not a command.  (GCC itself is
      # configured --without-system-zlib and needs no zstd on this platform;
      # both were read out of the official binary's embedded configure argv.)
      # nodejs is included because the
      # base image has none: every JavaScript action (cache, upload-artifact)
      # exits 127 inside this container under act.  A real runner mounts its
      # own node, so the package is redundant there and costs about 27 s; one
      # apt line that works in both places beats two code paths.
      #
      # The digest above pins the base image, but this apt layer on top of it
      # is mutable, so the resolved package set is printed into the log.  The
      # phase-5 package list cannot be restored for comparison: it lives under
      # tmp/toolchain_15.2.0-linux/, a path this phase is not permitted to read.
      - name: Install container build dependencies
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            bison flex texinfo gawk make gcc g++ libc6-dev m4 zlib1g-dev patch \
            python3 perl git curl ca-certificates nodejs \
            xz-utils bzip2 gzip tar diffutils findutils sed grep coreutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "--- installed apt package set ---"
          dpkg-query -W -f '${Package}\t${Version}\n' | sort

      - name: Record environment facts
        run: |
          set -eu
          printf 'P7_FACT\tnproc\t%s\n' "$(nproc)"
          printf 'P7_FACT\tuname\t%s %s\n' "$(uname -s)" "$(uname -m)"
          # Capacity provenance: the memory ceiling this job actually runs under
          # and the machine's own total, so a peak reading has a denominator.
          printf 'P7_FACT\tcgroup_memory_max\t%s\n' \
            "$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo unavailable)"
          printf 'P7_FACT\tmeminfo_total_kb\t%s\n' \
            "$(awk '/^MemTotal:/ {print $2}' /proc/meminfo 2>/dev/null || echo unavailable)"
          /usr/bin/gcc --version | sed -n 1p
          make --version | sed -n 1p
          python3 --version
          git --version
          bison --version | sed -n 1p
          flex --version | sed -n 1p
          makeinfo --version | sed -n 1p
          df -k . | tail -n 1

      - name: Cache the official WCH package archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/ci-cache/official
          key: official-linux-amd64-15.2.0-${{ hashFiles('ref/wch-evt/tools/fetch_wch_toolchain.py') }}

      - name: Provision the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprovision\t%s\n' "$(date +%s)"
          scripts/ci/provision-official.sh "$OPENWCH_VERSION"
          printf 'P7_DISK\tafter-provision\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tprovision\t%s\n' "$(date +%s)"

      # The EVT corpus (ref/wch-evt/Qingke*/, 25065 files) is not carried by
      # every checkout.  The public repository excludes it and distributes it
      # as a SHA-256 pinned pack that scripts/fetch-evt.sh fetches, verifies
      # and unpacks; a checkout that does carry it carries it unpatched, since
      # the nine modified files in a developer tree are apply.sh's applied
      # state.  The patch step is therefore mandatory in both cases and is
      # idempotent: one step, two ways in, a single apply at the end.
      #
      # The pack URL comes from the EVT_PACK_URL repository variable (Settings
      # > Secrets and variables > Actions > Variables).  The cache key is the
      # pack's own SHA-256, so a hit can only be the exact bytes fetch-evt.sh
      # demands and a new pack takes a new key instead of being served from a
      # stale entry.  Only a pack fetch-evt.sh has already accepted is moved
      # into the cache directory: an unverified download must never become the
      # entry every later run restores.
      - name: Cache the EVT corpus pack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Expression form, not $RUNNER_TEMP: `with:` inputs are not run
          # through a shell, so a shell variable would be taken literally.
          path: ${{ runner.temp }}/evt-cache
          key: evt-pack-18b7ddd6cb6bf148881648800a33097d3ff035019fe3ded55689aa0a3c646b58

      - name: Provision the EVT corpus and apply its patches
        run: |
          set -eu
          cache_dir="$RUNNER_TEMP/evt-cache"
          pack="$cache_dir/openwch-evt-d5added7.tar.gz"
          # Created unconditionally: the cache's post step reports a path that
          # does not exist, and the in-tree branch never creates one.
          mkdir -p "$cache_dir"
          if [ -d ref/wch-evt/QingkeV2AC_CH32V00x ]; then
            printf 'P7_EVT\tcorpus=in-tree\tpack=not-needed\n'
          elif [ -f "$pack" ]; then
            printf 'P7_EVT\tcorpus=absent\tpack=cache-hit\n'
            scripts/fetch-evt.sh --file "$pack"
          else
            printf 'P7_EVT\tcorpus=absent\tpack=cache-miss\n'
            if [ -z "${EVT_PACK_URL:-}" ]; then
              echo "The EVT corpus is not in this checkout, no pack is cached, and EVT_PACK_URL is empty." >&2
              echo "Set the repository variable EVT_PACK_URL to the URL of openwch-evt-d5added7.tar.gz" >&2
              echo "(Settings > Secrets and variables > Actions > Variables), or run act locally with" >&2
              echo "--env EVT_PACK_URL=<url>.  The pack's SHA-256 is pinned in scripts/fetch-evt.sh." >&2
              exit 1
            fi
            download="$RUNNER_TEMP/openwch-evt-pack.tar.gz"
            curl -fSL --retry 3 --retry-delay 2 -o "$download" "$EVT_PACK_URL"
            # fetch-evt.sh checks the SHA-256 fail-closed before it unpacks, so
            # reaching the mv is itself the proof that these are the pinned
            # bytes.  --apply is not used here: the apply below covers both
            # ways in, so neither can drift from the other.
            scripts/fetch-evt.sh --file "$download"
            mv "$download" "$pack"
          fi
          sh ref/wch-evt/patches/apply.sh

      - name: Prepare pristine sources and apply the patch series
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprepare\t%s\n' "$(date +%s)"
          scripts/ci/prepare-sources.sh "$OPENWCH_VERSION"
          printf 'P7_DISK\tafter-sources\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tprepare\t%s\n' "$(date +%s)"

      - name: Create the literal build path
        run: scripts/ci/setup-literal-paths.sh "$OPENWCH_VERSION"

      - name: Build the toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tbuild\t%s\n' "$(date +%s)"
          # Streaming instrumentation.  Every sample is printed as it is taken, so
          # a job killed at the platform ceiling still shows how far it got and
          # what the peak was up to that point; a summary written only at the end
          # would be lost in exactly the run that most needs diagnosing.
          # One block covers both platforms: cgroup v2 memory.peak inside the
          # linux container (measured readable), ps RSS on macOS where no cgroup
          # exists -- and macOS is where the 7 GB ceiling actually bites.
          target="${TOOLCHAIN_TREE:-$TOOLCHAIN_PROJECT}"
          samples="$RUNNER_TEMP/build-samples.tsv"
          : > "$samples"
          (
            while : ; do
              now=$(date +%s)
              kb=$( { du -sk "$target" 2>/dev/null || true; } | awk '{print $1}' || true)
              if [ -r /sys/fs/cgroup/memory.peak ]; then
                mem=$(cat /sys/fs/cgroup/memory.peak || echo 0); memmax=-1; memkind=cgroup-peak-bytes
              else
                # macOS has no cgroup.  The metric is vm_stat app memory
                # (active + wired + compressed), chosen by measurement: a
                # `ps -A -o rss=` sum reads 5.1x higher than app memory on the
                # same machine at the same instant, because RSS counts shared
                # text once per process.  "Pages free" is unusable in the other
                # direction -- macOS keeps memory nearly full as cache, so free
                # sits near zero and would imply the box is already exhausted.
                # Known bias: this metric reads LOW (the compressor absorbs
                # pages), so treat it as a floor.
                mem=$( { vm_stat 2>/dev/null || true; } | awk '
                  /page size of/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { psz = $i; break } }
                  /^Pages active:/ { gsub(/\./, "", $NF); a = $NF }
                  /^Pages wired down:/ { gsub(/\./, "", $NF); w = $NF }
                  /^Pages occupied by compressor:/ { gsub(/\./, "", $NF); c = $NF }
                  END { print (a + w + c) * psz }' || echo 0)
                memmax=-1
                memkind=vm_stat-app-bytes
              fi
              printf 'P7_SAMPLE\tbuild\t%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind" >> "$samples"
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          # The build script already announces its own phases on stdout as
          # `stage=<name>` (binutils-configure, binutils-build, gcc-configure,
          # gcc-all-gcc, ...).  Stamping those lines is what makes a single run
          # yield a phase breakdown; without it the whole build is one opaque
          # number and the serial fraction cannot even be approximated.
          # errexit is lifted around the pipeline on purpose: the peak-memory
          # reading has to be taken whether the build passed or failed, and a
          # failed capacity run is exactly when the number matters most.
          set -o pipefail
          set +e
          scripts/build-toolchain-15.2.0-linux.sh "$TOOLCHAIN_TREE" 2>&1 \
            | while IFS= read -r line; do
                printf '%s\n' "$line"
                case "$line" in
                  stage=*) printf 'P7_SUBSTAGE\t%s\t%s\n' "${line#stage=}" "$(date +%s)" ;;
                esac
              done
          build_rc=${PIPESTATUS[0]}
          set -e
          printf 'P7_SUBSTAGE\tbuild-finished\t%s\n' "$(date +%s)"
          kill "$sampler" 2>/dev/null || true
          trap - EXIT
          printf 'P7_MEM\tbuild-peak-bytes\t%s\tcgroup peak after the toolchain build\n' \
            "$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null || echo unavailable)"
          test "$build_rc" = 0
          printf 'P7_DISK\tbuild-peak\t%s\tpeak du -sk of the source and build tree\n' \
            "$(sort -n "$RUNNER_TEMP/build-disk-samples.txt" | tail -n 1)"
          printf 'P7_DISK\tafter-build\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tbuild\t%s\n' "$(date +%s)"

      - name: Upload the build stage logs
        # The build scripts write each stage's output to files under the source
        # tree; on a hosted runner those vanish with the workspace, so a failed
        # build is undiagnosable without this.  failure()-gated: green runs add
        # nothing.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ env.OPENWCH_PLATFORM }}-${{ env.OPENWCH_VERSION }}
          path: tmp/**/logs/**
          if-no-files-found: warn

      - name: Generate the golden manifest with the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-golden\t%s\n' "$(date +%s)"
          scripts/evt-golden.sh "$OPENWCH_VERSION"
          printf 'P7_STAGE\tend\tgate-golden\t%s\n' "$(date +%s)"

      - name: 'Assertion 1 and 2: manifest scale against absolute constants'
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          gate_rows=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" && $3 == "gate" { c++ } END { print c+0 }' "$manifest")
          projects=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" { print $1 }' "$manifest" | sort -u | wc -l | tr -d '[:space:]')
          echo "manifest_gate_rows=$gate_rows expected=$GATE_ARTIFACT_TOTAL"
          echo "manifest_projects=$projects expected=$GATE_PROJECT_TOTAL"
          test "$gate_rows" = "$GATE_ARTIFACT_TOTAL"
          test "$projects" = "$GATE_PROJECT_TOTAL"

      - name: Record raw manifest drift (diagnostic only, never a gate)
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          echo "raw_drift_lines=$(git diff --numstat -- "$manifest" | awk '{print $1"+"$2}')"
          git diff -- "$manifest" | head -n 200 || true

      - name: Compare our toolchain against the fresh manifest
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-compare\t%s\n' "$(date +%s)"
          set -o pipefail
          status=0
          scripts/evt-compare.sh "$OPENWCH_VERSION" "$TOOLCHAIN_TREE/output" \
            | tee "$RUNNER_TEMP/evt-compare.log" || status=$?
          echo "$status" > "$RUNNER_TEMP/evt-compare.status"
          echo "evt_compare_status=$status"
          printf 'P7_DISK\tafter-gate\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_MEM\tgate-peak\t%s\t%s\n' \
            "$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || ps -A -o rss= | awk '{s+=$1} END {print s+0}')" \
            "$([ -r /sys/fs/cgroup/memory.peak ] && echo 'cgroup-peak-bytes, cumulative high-water mark' || echo 'ps-rss-kb, sum over all processes')"
          printf 'P7_STAGE\tend\tgate-compare\t%s\n' "$(date +%s)"

      # The SUMMARY row is tab separated (evt-compare.sh:349-350); matching it
      # with spaces never fires.  Both the explicit field check and the script's
      # own exit status must agree, so neither is a single point of trust.
      - name: 'Assertion 3: comparison summary'
        run: |
          set -eu
          summary=$(awk -F '\t' '$1 == "SUMMARY" { print }' "$RUNNER_TEMP/evt-compare.log")
          test -n "$summary"
          echo "$summary"
          printf '%s\n' "$summary" | awk -F '\t' -v want="gate_pass=$GATE_ARTIFACT_TOTAL" '
            {
              pass = 0; fail = 0
              for (i = 2; i <= NF; i++) {
                if ($i == want) pass = 1
                if ($i == "gate_fail=0") fail = 1
              }
              exit (pass && fail) ? 0 : 1
            }'
          test "$(cat "$RUNNER_TEMP/evt-compare.status")" = "0"

      # Which two compilers the gate actually compared.  A green run whose
      # provenance is not recorded cannot be audited afterwards.
      - name: Record both toolchain identities
        if: always()
        run: |
          set -eu
          official="ref/gcc/${OPENWCH_PLATFORM}/${OPENWCH_VERSION}/bin/riscv32-wch-elf-gcc"
          ours="$TOOLCHAIN_TREE/output/bin/riscv32-wch-elf-gcc"
          for label in official ours; do
            eval "compiler=\$$label"
            if [ -x "$compiler" ]; then
              printf 'P7_TOOLCHAIN\t%s\tpath\t%s\n' "$label" "$compiler"
              printf 'P7_TOOLCHAIN\t%s\tversion\t%s\n' "$label" "$("$compiler" --version | sed -n 1p)"
              printf 'P7_TOOLCHAIN\t%s\tdumpmachine\t%s\n' "$label" "$("$compiler" -dumpmachine)"
            else
              printf 'P7_TOOLCHAIN\t%s\tmissing\t%s\n' "$label" "$compiler"
            fi
          done

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-linux-amd64-15.2.0
          path: |
            analysis/golden/15.2.0-linux-amd64.tsv
            ${{ runner.temp }}/evt-compare.log
          if-no-files-found: warn

  darwin-15-2-0:
    name: darwin-arm64 GCC 15.2.0
    runs-on: macos-15
    # Below the platform's 6 h hard limit on purpose: at exactly 360 the
    # platform cuts the job silently, losing the very data that would
    # explain the overrun.  15 minutes of headroom buys a diagnosable
    # timeout that still flushes what the instrumentation has collected.
    timeout-minutes: 345
    env:
      OPENWCH_VERSION: "15.2.0"
      OPENWCH_PLATFORM: darwin-arm64
      GATE_ARTIFACT_TOTAL: "274"
      GATE_PROJECT_TOTAL: "9"
      TOOLCHAIN_TREE: tmp/ci-src/15.2.0/riscv-gnu-toolchain
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure makeinfo is present
        # binutils built from a git tree regenerates doc/*.info, and the
        # macos-15 image ships no makeinfo, so all-bfd dies with Error 127.
        # Homebrew texinfo is keg-only and stays off the PATH unless added.
        run: |
          set -eu
          brew list texinfo >/dev/null 2>&1 || brew install texinfo
          echo "/opt/homebrew/opt/texinfo/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/texinfo/bin/makeinfo --version | head -n 1

      - name: Record environment facts
        run: |
          set -eu
          printf 'P7_FACT\tnproc\t%s\n' "$(sysctl -n hw.ncpu)"
          printf 'P7_FACT\tuname\t%s %s\n' "$(uname -s)" "$(uname -m)"
          /usr/bin/clang --version | sed -n 1p
          make --version | sed -n 1p
          python3 --version
          git --version
          df -k . | tail -n 1

      # build-toolchain-15.2.0.sh:105-106 requires Homebrew zstd headers and a
      # linkable library, and it rewrites the install name
      # /opt/homebrew/opt/zstd/lib/libzstd.1.dylib that Homebrew always uses.
      # The version does not matter: the dylib that ships in the built package
