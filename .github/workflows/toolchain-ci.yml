          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          gate_rows=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" && $3 == "gate" { c++ } END { print c+0 }' "$manifest")
          projects=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" { print $1 }' "$manifest" | sort -u | wc -l | tr -d '[:space:]')
          echo "manifest_gate_rows=$gate_rows expected=$GATE_ARTIFACT_TOTAL"
          echo "manifest_projects=$projects expected=$GATE_PROJECT_TOTAL"
          test "$gate_rows" = "$GATE_ARTIFACT_TOTAL"
          test "$projects" = "$GATE_PROJECT_TOTAL"

      - name: Record raw manifest drift (diagnostic only, never a gate)
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          echo "raw_drift_lines=$(git diff --numstat -- "$manifest" | awk '{print $1"+"$2}')"
          git diff -- "$manifest" | head -n 200 || true

      - name: Compare our toolchain against the fresh manifest
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-compare\t%s\n' "$(date +%s)"
          set -o pipefail
          status=0
          scripts/evt-compare.sh "$OPENWCH_VERSION" \
            "$TOOLCHAIN_PROJECT/build/darwin-arm64/application" \
            | tee "$RUNNER_TEMP/evt-compare.log" || status=$?
          echo "$status" > "$RUNNER_TEMP/evt-compare.status"
          echo "evt_compare_status=$status"
          printf 'P7_DISK\tafter-gate\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_MEM\tgate-peak\t%s\t%s\n' \
            "$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || ps -A -o rss= | awk '{s+=$1} END {print s+0}')" \
            "$([ -r /sys/fs/cgroup/memory.peak ] && echo 'cgroup-peak-bytes, cumulative high-water mark' || echo 'ps-rss-kb, sum over all processes')"
          printf 'P7_STAGE\tend\tgate-compare\t%s\n' "$(date +%s)"

      - name: 'Assertion 3: comparison summary'
        run: |
          set -eu
          summary=$(awk -F '\t' '$1 == "SUMMARY" { print }' "$RUNNER_TEMP/evt-compare.log")
          test -n "$summary"
          echo "$summary"
          printf '%s\n' "$summary" | awk -F '\t' -v want="gate_pass=$GATE_ARTIFACT_TOTAL" '
            {
              pass = 0; fail = 0
              for (i = 2; i <= NF; i++) {
                if ($i == want) pass = 1
                if ($i == "gate_fail=0") fail = 1
              }
              exit (pass && fail) ? 0 : 1
            }'
          test "$(cat "$RUNNER_TEMP/evt-compare.status")" = "0"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-darwin-arm64-12.2.0
          path: |
            analysis/golden/12.2.0-darwin-arm64.tsv
            ${{ runner.temp }}/evt-compare.log
          if-no-files-found: warn

  darwin-8-2-0:
    name: darwin-arm64 GCC 8.2.0
    # ---------------------------------------------------------------------
    # Runner choice, and why it is not the Intel image
    # ---------------------------------------------------------------------
    # The official 8.2.0 host executables are Mach-O x86_64, which makes a
    # native Intel runner look like the more faithful host, and
    # macos-15-intel exists as a standard hosted label (4 CPU / 14 GB RAM /
    # 14 GB SSD, free on public repositories, available until August 2027 as
    # the final x86_64 image on Actions).
    #
    # It cannot be used, because the gate harness is arm64-only on macOS:
    # evt-golden.sh:32-36 and evt-compare.sh:32-38 map Darwin/arm64 and Linux
    # x86_64 to a platform and die on anything else, so on an Intel runner both
    # scripts refuse to start with "unsupported host platform: Darwin/x86_64".
    # The platform string also names the manifest file, so accepting Intel
    # would fork the gate baseline rather than extend it.
    #
    # An arm64 runner reproduces the configuration that reached zero difference
    # locally: build-toolchain-8.2.0.sh:27-30 re-executes itself through
    # arch -x86_64, so the compiler is still built as an x86_64 host under
    # Rosetta 2, exactly as it was on the developer machine.  Rosetta 2 is
    # preinstalled on the arm64 macOS images -- the evidence is the image's own
    # packer template running install-rosetta.sh and the image self-test
    # asserting the oahd daemon, NOT the image Readme, which does not mention
    # Rosetta at all and would suggest the opposite.  The probe below therefore
    # checks rather than assumes, and installs only if the check fails.
    runs-on: macos-15
    # Below the platform's 6 h hard limit on purpose: at exactly 360 the
    # platform cuts the job silently, losing the very data that would
    # explain the overrun.  15 minutes of headroom buys a diagnosable
    # timeout that still flushes what the instrumentation has collected.
    timeout-minutes: 345
    env:
      OPENWCH_VERSION: "8.2.0"
      OPENWCH_PLATFORM: darwin-arm64
      # 242 artifacts over 8 projects: one of the nine quick-set projects is an
      # established exclusion for 8.2.0, not a defect.  evt-golden.sh:263
      # requires the project table to hold exactly nine rows, so the table must
      # not be trimmed to match.
      GATE_ARTIFACT_TOTAL: "242"
      GATE_PROJECT_TOTAL: "8"
      TOOLCHAIN_PROJECT: tmp/toolchain_8.2.0/work
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure makeinfo is present
        # binutils built from a git tree regenerates doc/*.info, and the
        # macos-15 image ships no makeinfo, so all-bfd dies with Error 127.
        # Homebrew texinfo is keg-only and stays off the PATH unless added.
        run: |
          set -eu
          brew list texinfo >/dev/null 2>&1 || brew install texinfo
          echo "/opt/homebrew/opt/texinfo/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/texinfo/bin/makeinfo --version | head -n 1

      - name: Record environment facts
        run: |
          set -eu
          printf 'P7_FACT\tnproc\t%s\n' "$(sysctl -n hw.ncpu)"
          printf 'P7_FACT\tuname\t%s %s\n' "$(uname -s)" "$(uname -m)"
          /usr/bin/clang --version | sed -n 1p
          make --version | sed -n 1p
          python3 --version
          git --version
          df -k . | tail -n 1

      # Load-bearing, not a contingency: this leg genuinely runs through
      # Rosetta, because build-toolchain-8.2.0.sh:27-30 re-executes itself with
      # arch -x86_64 to match the official --build/--host=x86_64-apple-darwin17
      # configure literal.  Rosetta 2 IS preinstalled on the arm64 macOS images
      # -- the evidence is the image's own packer template running
      # install-rosetta.sh and the image self-test asserting `pgrep oahd`.  The
      # image Readmes never mention Rosetta at all, so reading them alone would
      # wrongly suggest it is absent.  The step therefore probes and installs
      # only on failure instead of relying on the runner default either way.
      - name: Ensure Rosetta 2 can execute x86_64 binaries
        run: |
          set -eu
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "rosetta=present"
          else
            echo "rosetta=absent action=install"
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 /usr/bin/true
          fi

      - name: Cache the official MounRiver macOS package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/ci-cache/official
          key: official-mrs-macos-arm64-v2.5.0-189fdb95e898ec3f5ce4028166dd06c829f503227b6f8ae1a13bace9ec04937e

      - name: Provision the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprovision\t%s\n' "$(date +%s)"
          scripts/ci/provision-official.sh "$OPENWCH_VERSION"
          printf 'P7_DISK\tafter-provision\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tprovision\t%s\n' "$(date +%s)"

      # The EVT corpus (ref/wch-evt/Qingke*/, 25065 files) is not carried by
      # every checkout.  The public repository excludes it and distributes it
      # as a SHA-256 pinned pack that scripts/fetch-evt.sh fetches, verifies
      # and unpacks; a checkout that does carry it carries it unpatched, since
      # the nine modified files in a developer tree are apply.sh's applied
      # state.  The patch step is therefore mandatory in both cases and is
      # idempotent: one step, two ways in, a single apply at the end.
      #
      # The pack URL comes from the EVT_PACK_URL repository variable (Settings
      # > Secrets and variables > Actions > Variables).  The cache key is the
      # pack's own SHA-256, so a hit can only be the exact bytes fetch-evt.sh
      # demands and a new pack takes a new key instead of being served from a
      # stale entry.  Only a pack fetch-evt.sh has already accepted is moved
      # into the cache directory: an unverified download must never become the
      # entry every later run restores.
      - name: Cache the EVT corpus pack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Expression form, not $RUNNER_TEMP: `with:` inputs are not run
          # through a shell, so a shell variable would be taken literally.
          path: ${{ runner.temp }}/evt-cache
          key: evt-pack-18b7ddd6cb6bf148881648800a33097d3ff035019fe3ded55689aa0a3c646b58

      - name: Provision the EVT corpus and apply its patches
        run: |
          set -eu
          cache_dir="$RUNNER_TEMP/evt-cache"
          pack="$cache_dir/openwch-evt-d5added7.tar.gz"
          # Created unconditionally: the cache's post step reports a path that
          # does not exist, and the in-tree branch never creates one.
          mkdir -p "$cache_dir"
          if [ -d ref/wch-evt/QingkeV2AC_CH32V00x ]; then
            printf 'P7_EVT\tcorpus=in-tree\tpack=not-needed\n'
          elif [ -f "$pack" ]; then
            printf 'P7_EVT\tcorpus=absent\tpack=cache-hit\n'
            scripts/fetch-evt.sh --file "$pack"
          else
            printf 'P7_EVT\tcorpus=absent\tpack=cache-miss\n'
            if [ -z "${EVT_PACK_URL:-}" ]; then
              echo "The EVT corpus is not in this checkout, no pack is cached, and EVT_PACK_URL is empty." >&2
              echo "Set the repository variable EVT_PACK_URL to the URL of openwch-evt-d5added7.tar.gz" >&2
              echo "(Settings > Secrets and variables > Actions > Variables), or run act locally with" >&2
              echo "--env EVT_PACK_URL=<url>.  The pack's SHA-256 is pinned in scripts/fetch-evt.sh." >&2
              exit 1
            fi
            download="$RUNNER_TEMP/openwch-evt-pack.tar.gz"
            curl -fSL --retry 3 --retry-delay 2 -o "$download" "$EVT_PACK_URL"
            # fetch-evt.sh checks the SHA-256 fail-closed before it unpacks, so
            # reaching the mv is itself the proof that these are the pinned
            # bytes.  --apply is not used here: the apply below covers both
            # ways in, so neither can drift from the other.
            scripts/fetch-evt.sh --file "$download"
            mv "$download" "$pack"
          fi
          sh ref/wch-evt/patches/apply.sh

      # 8.2.0 pins gmp/mpfr/mpc/isl-0.18/zlib with its own SHA-256 gate.  Its
      # xPack GCC tree also carries a contrib/download_prerequisites, and that
      # file lists gmp-6.1.0, mpfr-3.1.4, mpc-1.0.3 -- three of four versions
      # differ from what the build script actually uses.  Using it would build a
      # different compiler while the gate still looked green.
      - name: Prepare pristine sources and apply the patch series
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tprepare\t%s\n' "$(date +%s)"
          scripts/ci/prepare-sources.sh "$OPENWCH_VERSION"
          printf 'P7_DISK\tafter-sources\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tprepare\t%s\n' "$(date +%s)"

      - name: Create the literal build path
        run: scripts/ci/setup-literal-paths.sh "$OPENWCH_VERSION"

      - name: Build the toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tbuild\t%s\n' "$(date +%s)"
          # Streaming instrumentation.  Every sample is printed as it is taken, so
          # a job killed at the platform ceiling still shows how far it got and
          # what the peak was up to that point; a summary written only at the end
          # would be lost in exactly the run that most needs diagnosing.
          # One block covers both platforms: cgroup v2 memory.peak inside the
          # linux container (measured readable), ps RSS on macOS where no cgroup
          # exists -- and macOS is where the 7 GB ceiling actually bites.
          target="${TOOLCHAIN_TREE:-$TOOLCHAIN_PROJECT}"
          samples="$RUNNER_TEMP/build-samples.tsv"
          : > "$samples"
          (
            while : ; do
              now=$(date +%s)
              kb=$( { du -sk "$target" 2>/dev/null || true; } | awk '{print $1}' || true)
              if [ -r /sys/fs/cgroup/memory.peak ]; then
                mem=$(cat /sys/fs/cgroup/memory.peak || echo 0); memmax=-1; memkind=cgroup-peak-bytes
              else
                # macOS has no cgroup.  The metric is vm_stat app memory
                # (active + wired + compressed), chosen by measurement: a
                # `ps -A -o rss=` sum reads 5.1x higher than app memory on the
                # same machine at the same instant, because RSS counts shared
                # text once per process.  "Pages free" is unusable in the other
                # direction -- macOS keeps memory nearly full as cache, so free
                # sits near zero and would imply the box is already exhausted.
                # Known bias: this metric reads LOW (the compressor absorbs
                # pages), so treat it as a floor.
                mem=$( { vm_stat 2>/dev/null || true; } | awk '
                  /page size of/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) { psz = $i; break } }
                  /^Pages active:/ { gsub(/\./, "", $NF); a = $NF }
                  /^Pages wired down:/ { gsub(/\./, "", $NF); w = $NF }
                  /^Pages occupied by compressor:/ { gsub(/\./, "", $NF); c = $NF }
                  END { print (a + w + c) * psz }' || echo 0)
                memmax=-1
                memkind=vm_stat-app-bytes
              fi
              printf 'P7_SAMPLE\tbuild\t%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$now" "${kb:-0}" "${mem:-0}" "${memmax:-0}" "$memkind" >> "$samples"
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          /usr/bin/time -l env CLEAN_HOST_DEPS=1 scripts/build-toolchain-8.2.0.sh 2> >(tee "$RUNNER_TEMP/time-l.txt" >&2)
          kill "$sampler" 2>/dev/null || true
          trap - EXIT
          printf 'P7_DISK\tbuild-peak\t%s\tpeak du -sk of the source and build tree\n' \
            "$(awk -F'\t' '{if ($2+0 > m) m = $2+0} END {print m+0}' "$samples")"
          printf 'P7_MEM\tbuild-peak\t%s\t%s\n' \
            "$(awk -F'\t' '{if ($3+0 > m) m = $3+0} END {print m+0}' "$samples")" \
            "$(awk -F'\t' 'END {print $5}' "$samples")"
          printf 'P7_MEM\tbuild-peak-largest-process\t%s\tlargest single process max RSS; -1 when unmeasured\n' \
            "$( [ -f "$RUNNER_TEMP/time-l.txt" ] && awk '/maximum resident set size/ {print $1; exit}' "$RUNNER_TEMP/time-l.txt" || awk -F'\t' '{if ($4+0 > m) m = $4+0} END {print m+0}' "$samples")"
          printf 'P7_DISK\tafter-build\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_STAGE\tend\tbuild\t%s\n' "$(date +%s)"

      - name: Upload the build stage logs
        # The build scripts write each stage's output to files under the source
        # tree; on a hosted runner those vanish with the workspace, so a failed
        # build is undiagnosable without this.  failure()-gated: green runs add
        # nothing.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ env.OPENWCH_PLATFORM }}-${{ env.OPENWCH_VERSION }}
          path: tmp/**/logs/**
          if-no-files-found: warn

      - name: Generate the golden manifest with the official toolchain
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-golden\t%s\n' "$(date +%s)"
          scripts/evt-golden.sh "$OPENWCH_VERSION"
          printf 'P7_STAGE\tend\tgate-golden\t%s\n' "$(date +%s)"

      - name: 'Assertion 1 and 2: manifest scale against absolute constants'
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          gate_rows=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" && $3 == "gate" { c++ } END { print c+0 }' "$manifest")
          projects=$(awk -F '\t' '$1 !~ /^#/ && $1 != "slug" { print $1 }' "$manifest" | sort -u | wc -l | tr -d '[:space:]')
          echo "manifest_gate_rows=$gate_rows expected=$GATE_ARTIFACT_TOTAL"
          echo "manifest_projects=$projects expected=$GATE_PROJECT_TOTAL"
          test "$gate_rows" = "$GATE_ARTIFACT_TOTAL"
          test "$projects" = "$GATE_PROJECT_TOTAL"

      - name: Record raw manifest drift (diagnostic only, never a gate)
        run: |
          set -eu
          manifest="analysis/golden/${OPENWCH_VERSION}-${OPENWCH_PLATFORM}.tsv"
          echo "raw_drift_lines=$(git diff --numstat -- "$manifest" | awk '{print $1"+"$2}')"
          git diff -- "$manifest" | head -n 200 || true

      - name: Compare our toolchain against the fresh manifest
        run: |
          set -eu
          printf 'P7_STAGE\tbegin\tgate-compare\t%s\n' "$(date +%s)"
          set -o pipefail
          status=0
          scripts/evt-compare.sh "$OPENWCH_VERSION" \
            "$TOOLCHAIN_PROJECT/darwin-x64/install/riscv-none-embed-gcc" \
            | tee "$RUNNER_TEMP/evt-compare.log" || status=$?
          echo "$status" > "$RUNNER_TEMP/evt-compare.status"
          echo "evt_compare_status=$status"
          printf 'P7_DISK\tafter-gate\t%s\tdf available KiB\n' "$(df -k . | tail -n 1 | awk '{print $4}')"
          printf 'P7_MEM\tgate-peak\t%s\t%s\n' \
            "$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || ps -A -o rss= | awk '{s+=$1} END {print s+0}')" \
            "$([ -r /sys/fs/cgroup/memory.peak ] && echo 'cgroup-peak-bytes, cumulative high-water mark' || echo 'ps-rss-kb, sum over all processes')"
          printf 'P7_STAGE\tend\tgate-compare\t%s\n' "$(date +%s)"

      - name: 'Assertion 3: comparison summary'
        run: |
          set -eu
          summary=$(awk -F '\t' '$1 == "SUMMARY" { print }' "$RUNNER_TEMP/evt-compare.log")
          test -n "$summary"
          echo "$summary"
          printf '%s\n' "$summary" | awk -F '\t' -v want="gate_pass=$GATE_ARTIFACT_TOTAL" '
            {
              pass = 0; fail = 0
              for (i = 2; i <= NF; i++) {
                if ($i == want) pass = 1
                if ($i == "gate_fail=0") fail = 1
              }
              exit (pass && fail) ? 0 : 1
            }'
          test "$(cat "$RUNNER_TEMP/evt-compare.status")" = "0"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-darwin-arm64-8.2.0
          path: |
            analysis/golden/8.2.0-darwin-arm64.tsv
            ${{ runner.temp }}/evt-compare.log
          if-no-files-found: warn
